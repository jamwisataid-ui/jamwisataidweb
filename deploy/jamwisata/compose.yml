name: jamwisata

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_MOBILE_ACTIVATION_URL: ${NEXT_PUBLIC_MOBILE_ACTIVATION_URL}
    image: jamwisata-web:${JAMWISATA_IMAGE_TAG:-latest}
    container_name: jamwisata-web
    restart: unless-stopped
    env_file:
      - ${JAMWISATA_ENV_FILE:-/opt/jamwisata/shared/app.env}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3300:3000"
    networks:
      - edge
      - outbound
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: jamwisata-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - internal
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  livekit:
    image: livekit/livekit-server:v1.13.9
    container_name: jamwisata-livekit
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        redis:
          address: 127.0.0.1:6380
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        turn:
          enabled: true
          udp_port: 3478
          domain: ${LIVEKIT_TURN_DOMAIN}
    command: ["--config-body", "$${LIVEKIT_CONFIG}"]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /livekit-server
        - --version
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    profiles: ["realtime"]

networks:
  internal:
    name: jamwisata-internal
    internal: true
  edge:
    external: true
    name: erp-retail_backend
  outbound:
    name: jamwisata-outbound
    driver: bridge

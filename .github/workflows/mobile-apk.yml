name: Build Android preview APK

on:
  workflow_dispatch:
  push:
    tags:
      - "mobile-android-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Check release configuration
        shell: bash
        run: |
          for name in EXPO_TOKEN R2_ENDPOINT R2_BUCKET_NAME AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name secret" >&2
              exit 1
            fi
          done
          version="$(node -p "require('./app.json').expo.version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "app.json expo.version must be a numeric major.minor.patch version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/mobile-android-v* && "${GITHUB_REF#refs/tags/mobile-android-v}" != "$version" ]]; then
            echo "Release tag does not match app.json expo.version" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install and verify mobile app
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Build preview APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json
      - name: Download APK
        shell: bash
        run: |
          apk_url="$(node -e "const fs=require('fs'); const raw=JSON.parse(fs.readFileSync('build.json','utf8')); const build=Array.isArray(raw)?raw[0]:raw; if(build?.status!=='FINISHED' || !build?.artifacts?.buildUrl) process.exit(1); process.stdout.write(build.artifacts.buildUrl)")"
          if [[ "$apk_url" != https://* ]]; then
            echo "EAS did not return an HTTPS APK artifact" >&2
            exit 1
          fi
          curl --fail --location --retry 3 "$apk_url" --output app.apk
          test -s app.apk
          unzip -tq app.apk > /dev/null
      - name: Upload current APK to R2
        shell: bash
        run: |
          python -m pip install --quiet awscli
          aws --endpoint-url "$R2_ENDPOINT" s3 cp app.apk "s3://$R2_BUCKET_NAME/private/mobile/releases/jam-wisata-latest.apk" \
            --content-type application/vnd.android.package-archive \
            --metadata "version=$APP_VERSION" --no-progress
